[coverage:run]
branch = True
source = .
omit = tests/*, .venv/*, .tox/*, setup.py

[coverage:report]
precision = 2

# Not run in pre-commit/CI anymore (ruff replaced it there) — kept only so editors/other
# repos still running flake8 directly
[flake8]
max-complexity = 10
max-line-length = 88
extend-ignore = E203

[mypy]
show_error_codes = true
show_traceback = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

# No stubs exist (or undeclared/optional deps) for these — don't fail on missing imports.
[mypy-pandas_gbq,snowflake.*,google.cloud.*,statsmodels.*,sklearn.*,scipy.stats,matplotlib.*,matplotlib_venn,plotly.*,seaborn,unidecode,plot_metric.*]
ignore_missing_imports = true
